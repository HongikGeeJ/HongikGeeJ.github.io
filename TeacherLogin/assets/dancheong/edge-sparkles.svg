<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 20" fill="none">
  <!-- Soft sea-tone shimmer rail (content-card top/bottom) — no multi-hue flicker -->
  <defs>
    <linearGradient id="seaRail" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7eb6d9" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7eb6d9" stop-opacity=".42"/>
      <stop offset="50%" stop-color="#4a6fa5" stop-opacity=".52"/>
      <stop offset="82%" stop-color="#7eb6d9" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#7eb6d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="seaGlow" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;.28;0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="seaShine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="90" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#e8f4fc" stop-opacity=".75"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-100 0" to="430 0" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <!-- Soft under-glow -->
  <path d="M12 10 C52 6.5 92 13.5 132 10 S212 6.5 252 10 S332 13.5 372 10"
        stroke="url(#seaGlow)" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>
  <!-- Gentle wave rail -->
  <path d="M12 10 C52 6.5 92 13.5 132 10 S212 6.5 252 10 S332 13.5 372 10"
        stroke="url(#seaRail)" stroke-width="1.15" stroke-linecap="round"/>
  <!-- Traveling shimmer -->
  <path d="M12 10 C52 6.5 92 13.5 132 10 S212 6.5 252 10 S332 13.5 372 10"
        stroke="url(#seaShine)" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <!-- Soft pearl beads — slow sea-tone breathe only -->
  <circle cx="68" cy="8.6" r="1.35" fill="#bae6fd">
    <animate attributeName="opacity" values=".18;.42;.18" dur="5.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="11.2" r="1.15" fill="#7eb6d9">
    <animate attributeName="opacity" values=".16;.38;.16" dur="5.8s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="228" cy="8.4" r="1.45" fill="#e0f2fe">
    <animate attributeName="opacity" values=".2;.48;.2" dur="6.2s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="308" cy="11.4" r="1.2" fill="#93c5fd">
    <animate attributeName="opacity" values=".15;.36;.15" dur="5.5s" begin=".7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="348" cy="9.2" r="1.05" fill="#c7dff0">
    <animate attributeName="opacity" values=".14;.34;.14" dur="6s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
