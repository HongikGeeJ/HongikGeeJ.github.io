<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" shape-rendering="geometricPrecision">
  <!--
    Content-card corner bloom (TL outer corner).
    Dense 6-flower cluster hugging the rounded edge; flip via CSS for BR.
    Palette: green leaves / white / yellow / purple.
  -->
  <!-- Leaf fans flush to outer corner — solid for clarity -->
  <path d="M1 48 C3 24 18 8 42 3 C26 12 12 26 7 46 C5 50 2 50 1 48 Z"
        fill="#3D9A5C"/>
  <path d="M3 46 C8 26 20 12 38 7 C24 15 13 28 9 44 C7 48 4 48 3 46 Z"
        fill="#6BC484"/>
  <path d="M30 2 C16 5 7 18 4 34 C12 18 22 7 36 4 C34 2.5 32 1.8 30 2 Z"
        fill="#8ED4A0"/>
  <path d="M2 30 C5 16 16 6 32 3 C16 9 7 20 4 34 C3 32 2.2 30.5 2 30 Z"
        fill="#A8E0B4"/>
  <ellipse cx="10" cy="38" rx="4" ry="8" fill="#5BB87A" transform="rotate(-28 10 38)"/>
  <ellipse cx="38" cy="10" rx="8" ry="4" fill="#7CC994" transform="rotate(28 38 10)"/>

  <!-- 1) Hero white daisy at corner bend -->
  <g transform="translate(22 22)">
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#7B5CB8"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#9B7AD4" transform="rotate(45)"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#6A4AA8" transform="rotate(90)"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#A888E0" transform="rotate(135)"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#7B5CB8" transform="rotate(180)"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#9470CC" transform="rotate(225)"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#6E50B0" transform="rotate(270)"/>
    <ellipse cx="0" cy="-10" rx="5.2" ry="10" fill="#B094E8" transform="rotate(315)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFFFFF"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFFDF8" transform="rotate(45)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFFEFA" transform="rotate(90)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFF9F0" transform="rotate(135)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFFFFF" transform="rotate(180)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFFCF5" transform="rotate(225)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFFFFF" transform="rotate(270)"/>
    <ellipse cx="0" cy="-7.6" rx="3.8" ry="7.8" fill="#FFF8EC" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="4.6" fill="#E8B020"/>
    <circle cx="0" cy="0" r="3.1" fill="#F5D24A"/>
    <circle cx="0" cy="0" r="1.6" fill="#FFE97A"/>
    <circle cx="-.7" cy="-.9" r="1" fill="#FFF8D0" opacity=".9"/>
  </g>

  <!-- 2) Medium purple bloom (top arm) -->
  <g transform="translate(42 14)">
    <ellipse cx="0" cy="-6.2" rx="3.4" ry="6.4" fill="#8B6BC9"/>
    <ellipse cx="0" cy="-6.2" rx="3.4" ry="6.4" fill="#C4A8F0" transform="rotate(60)"/>
    <ellipse cx="0" cy="-6.2" rx="3.4" ry="6.4" fill="#7B5CB8" transform="rotate(120)"/>
    <ellipse cx="0" cy="-6.2" rx="3.4" ry="6.4" fill="#A888E0" transform="rotate(180)"/>
    <ellipse cx="0" cy="-6.2" rx="3.4" ry="6.4" fill="#9B7AD4" transform="rotate(240)"/>
    <ellipse cx="0" cy="-6.2" rx="3.4" ry="6.4" fill="#B094E8" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="2.8" fill="#F0C83A"/>
    <circle cx="-.4" cy="-.5" r=".8" fill="#FFF6C8"/>
  </g>

  <!-- 3) Medium white–lavender bloom (left arm) -->
  <g transform="translate(14 42)">
    <ellipse cx="0" cy="-5.8" rx="3.2" ry="6" fill="#EDE4F8"/>
    <ellipse cx="0" cy="-5.8" rx="3.2" ry="6" fill="#FFFFFF" transform="rotate(60)"/>
    <ellipse cx="0" cy="-5.8" rx="3.2" ry="6" fill="#D4C0F0" transform="rotate(120)"/>
    <ellipse cx="0" cy="-5.8" rx="3.2" ry="6" fill="#FFF8E0" transform="rotate(180)"/>
    <ellipse cx="0" cy="-5.8" rx="3.2" ry="6" fill="#FFFFFF" transform="rotate(240)"/>
    <ellipse cx="0" cy="-5.8" rx="3.2" ry="6" fill="#C4A8F0" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="2.5" fill="#F5D24A"/>
    <circle cx="-.35" cy="-.45" r=".7" fill="#FFF8D0" opacity=".9"/>
  </g>

  <!-- 4) Small purple bud (outer tip along top) -->
  <g transform="translate(56 22)">
    <ellipse cx="0" cy="-4.2" rx="2.4" ry="4.4" fill="#8B6BC9"/>
    <ellipse cx="0" cy="-4.2" rx="2.4" ry="4.4" fill="#C4A8F0" transform="rotate(72)"/>
    <ellipse cx="0" cy="-4.2" rx="2.4" ry="4.4" fill="#7B5CB8" transform="rotate(144)"/>
    <ellipse cx="0" cy="-4.2" rx="2.4" ry="4.4" fill="#FFFFFF" transform="rotate(216)"/>
    <ellipse cx="0" cy="-4.2" rx="2.4" ry="4.4" fill="#A888E0" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="1.9" fill="#F0C83A"/>
    <circle cx="-.3" cy="-.4" r=".55" fill="#FFF6C8"/>
  </g>

  <!-- 5) Small white–yellow blossom (outer tip along left) -->
  <g transform="translate(22 56)">
    <circle cx="0" cy="-2.8" r="1.9" fill="#FFFFFF"/>
    <circle cx="2.4" cy="-.9" r="1.9" fill="#EDE4F8"/>
    <circle cx="1.5" cy="2.2" r="1.9" fill="#FFF8E0"/>
    <circle cx="-1.5" cy="2.2" r="1.9" fill="#D4C0F0"/>
    <circle cx="-2.4" cy="-.9" r="1.9" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="1.35" fill="#F5D24A"/>
  </g>

  <!-- 6) Tiny accent bloom nestled between hero + arms -->
  <g transform="translate(34 34)">
    <ellipse cx="0" cy="-3.4" rx="1.9" ry="3.5" fill="#B094E8"/>
    <ellipse cx="0" cy="-3.4" rx="1.9" ry="3.5" fill="#FFFFFF" transform="rotate(72)"/>
    <ellipse cx="0" cy="-3.4" rx="1.9" ry="3.5" fill="#9B7AD4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-3.4" rx="1.9" ry="3.5" fill="#FFF8EC" transform="rotate(216)"/>
    <ellipse cx="0" cy="-3.4" rx="1.9" ry="3.5" fill="#A888E0" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="1.45" fill="#E8B020"/>
    <circle cx="-.25" cy="-.35" r=".45" fill="#FFE97A"/>
  </g>
</svg>
