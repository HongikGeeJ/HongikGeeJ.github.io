# Push to main → https://hongikgeej.github.io/TeacherLogin/
# Root https://hongikgeej.github.io/ redirects to /TeacherLogin/
# Repo: HongikGeeJ/HongikGeeJ.github.io · Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage TeacherLogin site
        run: |
          set -euo pipefail
          mkdir -p TeacherLogin
          cp "HongikGeeJ Teacher Login.html" TeacherLogin/index.html
          rm -rf TeacherLogin/assets TeacherLogin/data
          cp -a assets TeacherLogin/assets
          cp -a data TeacherLogin/data
          cp -a logo.png TeacherLogin/logo.png
          touch .nojekyll
          test -f TeacherLogin/index.html
          test -d TeacherLogin/assets
          test -d TeacherLogin/data
          echo "Staged TeacherLogin/ for https://hongikgeej.github.io/TeacherLogin/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
