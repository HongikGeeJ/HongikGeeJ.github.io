# Push to main → https://hongikgeej.github.io/TeacherLogin/
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage lean Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/TeacherLogin
          cp "HongikGeeJ Teacher Login.html" _site/TeacherLogin/index.html
          cp -a assets _site/TeacherLogin/assets
          cp -a data _site/TeacherLogin/data
          cp -a logo.png _site/TeacherLogin/logo.png
          if [ -f index.html ]; then cp index.html _site/index.html; else
            printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0;url=/TeacherLogin/">' > _site/index.html
          fi
          touch _site/.nojekyll
          test -f _site/TeacherLogin/assets/dancheong/corner-flower-bottom.svg
          du -sh _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
