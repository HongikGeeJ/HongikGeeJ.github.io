<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" shape-rendering="geometricPrecision">
  <!--
    Login / shell BOTTOM-LEFT cluster (distinct from top L-corner).
    Authored for CSS origin 0,0 then scaleY(-1) at BL / scale(-1) at BR.
    Composition: low horizontal spray along the paper edge + short upright buds 
    not a mirror of the top L-shaped pink/purple cluster.
    Palette: peach  cream  soft coral  sage (vs top pink/purple).
  -->
  <!-- Ground leaf ribbon  mostly along the horizontal edge -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-1.2 48 8; 1.4 48 8; -1.2 48 8" keyTimes="0;0.5;1"
      dur="8s" begin="-0.6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path d="M2 2 C28 0 58 1 88 8 C62 4 34 2 10 6 C4 4 2 3 2 2 Z"
          fill="#7DB88A"/>
    <path d="M4 4 C30 2 56 3 82 10 C58 5 32 4 12 8 C6 6 4 5 4 4 Z"
          fill="#A5D4A8"/>
    <path d="M8 6 C26 3 48 4 70 12 C48 6 28 5 14 10 C10 8 8 7 8 6 Z"
          fill="#C5E8CB"/>
  </g>
  <!-- Short vertical accent (not a full L arm) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="1.2 8 28; -1.5 8 28; 1.2 8 28" keyTimes="0;0.5;1"
      dur="7.2s" begin="-1.8s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path d="M2 4 C0 22 2 44 10 62 C4 42 2 22 4 8 C3 5 2.5 4 2 4 Z"
          fill="#8FC99A"/>
    <path d="M4 6 C2 24 4 42 12 58 C6 40 4 24 6 10 C5 7 4.5 6 4 6 Z"
          fill="#B8E0BA"/>
  </g>
  <ellipse cx="18" cy="6" rx="9" ry="4.2" fill="#93C99A" transform="rotate(-8 18 6)"/>
  <ellipse cx="52" cy="5" rx="11" ry="4.5" fill="#6FA87C" transform="rotate(6 52 5)"/>
  <ellipse cx="78" cy="10" rx="7" ry="3.6" fill="#A5D4A8" transform="rotate(14 78 10)"/>
  <ellipse cx="6" cy="36" rx="3.8" ry="8" fill="#B5DCB8" transform="rotate(-18 6 36)"/>

  <!-- Hero creampeach daisy (center of horizontal spray) -->
  <g transform="translate(36 18)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.05;1" keyTimes="0;0.5;1" dur="4.8s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-1.8;2;-1.8" keyTimes="0;0.5;1" dur="5.6s" begin="-1s" repeatCount="indefinite"
        additive="sum" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#F6C4A8"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#FFD9C2" transform="rotate(45)"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#E8A888" transform="rotate(90)"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#FFF0E4" transform="rotate(135)"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#F2B898" transform="rotate(180)"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#FFE4D0" transform="rotate(225)"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#E89878" transform="rotate(270)"/>
      <ellipse cx="0" cy="-9.5" rx="5.6" ry="9.2" fill="#FFF8F0" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="4.2" fill="#F0C83A"/>
      <circle cx="0" cy="0" r="2.8" fill="#FFE97A"/>
      <circle cx="-.6" cy="-.7" r=".9" fill="#FFF8D0"/>
    </g>
  </g>

  <!-- Soft coral bloom (outer along edge) -->
  <g transform="translate(62 14)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="2;-2.4;2" keyTimes="0;0.5;1" dur="5.2s" begin="-1.4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-6.2" rx="3.6" ry="6.4" fill="#F2A090"/>
      <ellipse cx="0" cy="-6.2" rx="3.6" ry="6.4" fill="#FFC8B8" transform="rotate(60)"/>
      <ellipse cx="0" cy="-6.2" rx="3.6" ry="6.4" fill="#E88878" transform="rotate(120)"/>
      <ellipse cx="0" cy="-6.2" rx="3.6" ry="6.4" fill="#FFE0D4" transform="rotate(180)"/>
      <ellipse cx="0" cy="-6.2" rx="3.6" ry="6.4" fill="#F0A898" transform="rotate(240)"/>
      <ellipse cx="0" cy="-6.2" rx="3.6" ry="6.4" fill="#FFF0EA" transform="rotate(300)"/>
      <circle cx="0" cy="0" r="2.6" fill="#E8B020"/>
      <circle cx="-.35" cy="-.45" r=".7" fill="#FFF6C8"/>
    </g>
  </g>

  <!-- Small cream bud (inner) -->
  <g transform="translate(18 16)">
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.6" fill="#FFF8EC"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.6" fill="#FFE4C8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.6" fill="#F6D0B0" transform="rotate(144)"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.6" fill="#FFFFFF" transform="rotate(216)"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.6" fill="#FFDCC0" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="1.9" fill="#F5D24A"/>
  </g>

  <!-- Tiny upright peach bud (short vertical  different silhouette from top) -->
  <g transform="translate(10 42)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.06;1" keyTimes="0;0.5;1" dur="4.4s" begin="-2.2s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <circle cx="0" cy="-2.4" r="2.1" fill="#FFE4D0"/>
      <circle cx="2.1" cy="-.7" r="2.1" fill="#F2A090"/>
      <circle cx="1.3" cy="2" r="2.1" fill="#FFF8F0"/>
      <circle cx="-1.3" cy="2" r="2.1" fill="#FFC8B8"/>
      <circle cx="-2.1" cy="-.7" r="2.1" fill="#FFE0D4"/>
      <circle cx="0" cy="0" r="1.4" fill="#E8B020"/>
    </g>
  </g>

  <!-- Soft floating petal -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 2 -2.5; 0.8 -4.5; -1.2 -1.8; 0 0" keyTimes="0;0.28;0.55;0.78;1"
      dur="9.2s" begin="-1.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <ellipse cx="70" cy="28" rx="3.2" ry="1.8" fill="#FFD9C2" opacity=".85" transform="rotate(-28 70 28)"/>
  </g>
</svg>
