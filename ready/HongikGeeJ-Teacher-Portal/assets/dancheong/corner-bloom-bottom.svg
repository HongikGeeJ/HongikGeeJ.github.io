<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" shape-rendering="geometricPrecision">
  <!--
    Content-card BOTTOM-RIGHT bloom (distinct from TL corner-bloom).
    Authored for CSS origin 0,0 then scale(-1) at BR.
    Composition: horizontal edge spray + coral/cream/sage  not a flipped copy of the
    dense white/purple TL cluster.
  -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-1.4 40 8; 1.6 40 8; -1.4 40 8" keyTimes="0;0.5;1"
      dur="7s" begin="-0.4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path d="M2 2 C22 0 48 1 74 8 C50 3 28 2 10 5 C4 3 2 2.5 2 2 Z"
          fill="#3D9A5C"/>
    <path d="M4 4 C24 2 46 3 68 10 C48 4 28 4 12 7 C6 5 4 4.5 4 4 Z"
          fill="#6BC484"/>
    <path d="M8 5 C26 3 44 4 62 11 C44 5 28 5 14 8 C10 6.5 8 5.5 8 5 Z"
          fill="#A8E0B4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="1.3 8 24; -1.5 8 24; 1.3 8 24" keyTimes="0;0.5;1"
      dur="6.6s" begin="-1.6s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path d="M2 3 C1 18 3 36 9 52 C4 34 2 18 3 7 C2.5 4.5 2.2 3.2 2 3 Z"
          fill="#8ED4A0"/>
  </g>
  <ellipse cx="16" cy="5" rx="7" ry="3.4" fill="#5BB87A" transform="rotate(-6 16 5)"/>
  <ellipse cx="44" cy="4" rx="9" ry="3.8" fill="#7CC994" transform="rotate(8 44 4)"/>
  <ellipse cx="6" cy="30" rx="3.2" ry="6.5" fill="#A8E0B4" transform="rotate(-16 6 30)"/>

  <!-- Hero cream daisy -->
  <g transform="translate(30 16)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.05;1" keyTimes="0;0.5;1" dur="4.6s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#FFF8EC"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#FFE4C8" transform="rotate(45)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#F6D0B0" transform="rotate(90)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#FFFFFF" transform="rotate(135)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#FFDCC0" transform="rotate(180)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#FFF0E4" transform="rotate(225)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#F2B898" transform="rotate(270)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="8.2" fill="#FFFDF8" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="3.6" fill="#E8B020"/>
      <circle cx="0" cy="0" r="2.4" fill="#F5D24A"/>
      <circle cx="-.5" cy="-.6" r=".75" fill="#FFE97A"/>
    </g>
  </g>

  <!-- Coral accent along edge -->
  <g transform="translate(52 12)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="2.2;-2.4;2.2" keyTimes="0;0.5;1" dur="5.4s" begin="-1.2s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-5.2" rx="3" ry="5.4" fill="#F2A090"/>
      <ellipse cx="0" cy="-5.2" rx="3" ry="5.4" fill="#FFC8B8" transform="rotate(60)"/>
      <ellipse cx="0" cy="-5.2" rx="3" ry="5.4" fill="#E88878" transform="rotate(120)"/>
      <ellipse cx="0" cy="-5.2" rx="3" ry="5.4" fill="#FFE0D4" transform="rotate(180)"/>
      <ellipse cx="0" cy="-5.2" rx="3" ry="5.4" fill="#F0A898" transform="rotate(240)"/>
      <ellipse cx="0" cy="-5.2" rx="3" ry="5.4" fill="#FFF0EA" transform="rotate(300)"/>
      <circle cx="0" cy="0" r="2.2" fill="#F0C83A"/>
    </g>
  </g>

  <!-- Small peach bud near vertical stub -->
  <g transform="translate(12 34)">
    <circle cx="0" cy="-2.2" r="1.8" fill="#FFE4D0"/>
    <circle cx="1.9" cy="-.6" r="1.8" fill="#F2A090"/>
    <circle cx="1.2" cy="1.8" r="1.8" fill="#FFF8F0"/>
    <circle cx="-1.2" cy="1.8" r="1.8" fill="#FFC8B8"/>
    <circle cx="-1.9" cy="-.6" r="1.8" fill="#FFE0D4"/>
    <circle cx="0" cy="0" r="1.2" fill="#E8B020"/>
  </g>

  <!-- Tiny cream accent -->
  <g transform="translate(18 14)">
    <ellipse cx="0" cy="-3.2" rx="1.8" ry="3.3" fill="#FFF8EC"/>
    <ellipse cx="0" cy="-3.2" rx="1.8" ry="3.3" fill="#FFDCC0" transform="rotate(72)"/>
    <ellipse cx="0" cy="-3.2" rx="1.8" ry="3.3" fill="#FFFFFF" transform="rotate(144)"/>
    <ellipse cx="0" cy="-3.2" rx="1.8" ry="3.3" fill="#F6D0B0" transform="rotate(216)"/>
    <ellipse cx="0" cy="-3.2" rx="1.8" ry="3.3" fill="#FFE4C8" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="1.3" fill="#F5D24A"/>
  </g>
</svg>
