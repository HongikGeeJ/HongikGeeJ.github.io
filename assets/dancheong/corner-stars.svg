<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" shape-rendering="geometricPrecision">
  <!--
    Login panel corner stars (TL). Flip via CSS for TR / BL / BR.
    Clear sparkling 4-point stars + soft glow dots  SMIL opacity twinkle.
  -->
  <defs>
    <radialGradient id="starWash" cx="18%" cy="18%" r="58%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity=".42"/>
      <stop offset="45%" stop-color="#c5e0f8" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#c5e0f8" stop-opacity="0"/>
    </radialGradient>
    <g id="star4">
      <path d="M0 -1 L.28 -.28 L1 0 L.28 .28 L0 1 L-.28 .28 L-1 0 L-.28 -.28 Z" fill="currentColor"/>
      <circle cx="0" cy="0" r=".22" fill="#fff"/>
    </g>
  </defs>

  <!-- Soft corner shimmer wash -->
  <circle cx="16" cy="16" r="30" fill="url(#starWash)"/>

  <!-- Primary star cluster (hugs outer corner) -->
  <g color="#fff6d0">
    <g transform="translate(14 12) scale(3.4)">
      <animate attributeName="opacity" values=".35;1;.45;.92;.35" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <use href="#star4"/>
      <circle cx="0" cy="0" r=".55" fill="#ffe9a8" opacity=".85"/>
    </g>
    <g transform="translate(30 10) scale(2.2)">
      <animate attributeName="opacity" values=".2;.95;.3;.8;.2" dur="2.9s" begin="-.6s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
    <g transform="translate(22 28) scale(2.6)">
      <animate attributeName="opacity" values=".25;1;.35;.85;.25" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/>
      <use href="#star4"/>
      <circle cx="0" cy="0" r=".4" fill="#fff" opacity=".9"/>
    </g>
    <g transform="translate(40 24) scale(1.8)">
      <animate attributeName="opacity" values=".15;.88;.22;.7;.15" dur="2.6s" begin="-1.8s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
    <g transform="translate(12 34) scale(1.6)">
      <animate attributeName="opacity" values=".18;.8;.28;.65;.18" dur="3.5s" begin="-0.4s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
    <g transform="translate(36 40) scale(2)">
      <animate attributeName="opacity" values=".12;.9;.2;.75;.12" dur="2.2s" begin="-2.2s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
  </g>

  <!-- Cool white / ice accent stars -->
  <g color="#e8f4ff">
    <g transform="translate(46 14) scale(1.5)">
      <animate attributeName="opacity" values=".2;1;.3;.85;.2" dur="2.1s" begin="-0.9s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
    <g transform="translate(48 34) scale(1.35)">
      <animate attributeName="opacity" values=".1;.75;.18;.6;.1" dur="3.1s" begin="-1.5s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
    <g transform="translate(26 46) scale(1.25)">
      <animate attributeName="opacity" values=".15;.7;.25;.55;.15" dur="2.7s" begin="-2.6s" repeatCount="indefinite"/>
      <use href="#star4"/>
    </g>
  </g>

  <!-- Tiny glow dots (extra sparkle between stars) -->
  <g>
    <g>
      <animate attributeName="opacity" values=".15;.85;.2;.7;.15" dur="1.9s" begin="0s" repeatCount="indefinite"/>
      <circle cx="20" cy="20" r="1.4" fill="#fffce8"/>
      <circle cx="20" cy="20" r=".55" fill="#fff"/>
    </g>
    <g>
      <animate attributeName="opacity" values=".1;.7;.15;.55;.1" dur="2.5s" begin="-.7s" repeatCount="indefinite"/>
      <circle cx="38" cy="16" r="1.1" fill="#dceeff"/>
    </g>
    <g>
      <animate attributeName="opacity" values=".12;.8;.2;.6;.12" dur="2.3s" begin="-1.3s" repeatCount="indefinite"/>
      <circle cx="16" cy="42" r="1" fill="#ffe9b0"/>
    </g>
    <g>
      <animate attributeName="opacity" values=".08;.65;.14;.5;.08" dur="2.8s" begin="-2s" repeatCount="indefinite"/>
      <circle cx="42" cy="42" r=".9" fill="#fff"/>
    </g>
    <g>
      <animate attributeName="opacity" values=".1;.75;.18;.58;.1" dur="2s" begin="-0.3s" repeatCount="indefinite"/>
      <circle cx="52" cy="22" r=".85" fill="#fff8e0"/>
    </g>
  </g>
</svg>
