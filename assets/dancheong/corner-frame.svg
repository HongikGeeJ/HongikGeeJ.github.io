<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    Rich paper-edge flower cluster (top-left).
    Leaves flush to outer L; blooms cascade along both arms.
    Flip via CSS for TR / BL / BR.
  -->
  <!-- Leaf ribbon hugging outer paper edge -->
  <path d="M0 64 C1 38 16 14 42 4 C24 16 10 34 6 58 C3 64 1 66 0 64 Z"
        fill="#9CCC9E" opacity=".9"/>
  <path d="M1 62 C3 40 18 16 44 6 C26 18 12 36 8 56 C5 62 2 64 1 62 Z"
        fill="#B8DDB8"/>
  <path d="M64 0 C38 1 14 16 4 42 C16 24 34 10 58 6 C64 3 66 1 64 0 Z"
        fill="#A8D5B5" opacity=".92"/>
  <path d="M62 1 C40 3 16 18 6 44 C18 26 36 12 56 8 C62 4 64 2 62 1 Z"
        fill="#C8E6C9"/>
  <path d="M2 32 C12 10 30 2 52 1 C28 8 12 20 4 40 C2.5 36 1.5 33 2 32 Z"
        fill="#D4EDDA" opacity=".92"/>
  <path d="M32 2 C12 8 4 24 2 46 C8 24 20 10 40 4 C36 2.5 33.5 1.5 32 2 Z"
        fill="#E8F5E9" opacity=".88"/>

  <!-- Extra leaf tips along arms -->
  <ellipse cx="12" cy="54" rx="5.5" ry="11" fill="#8FBF9A" opacity=".72" transform="rotate(-22 12 54)"/>
  <ellipse cx="54" cy="12" rx="11" ry="5.5" fill="#A5D6A7" opacity=".75" transform="rotate(22 54 12)"/>
  <ellipse cx="20" cy="28" rx="5" ry="9" fill="#C8E6C9" opacity=".8" transform="rotate(-48 20 28)"/>
  <ellipse cx="28" cy="20" rx="9" ry="5" fill="#B8DDB8" opacity=".78" transform="rotate(48 28 20)"/>
  <ellipse cx="8" cy="74" rx="4.2" ry="8" fill="#A8D5B5" opacity=".7" transform="rotate(-12 8 74)"/>
  <ellipse cx="74" cy="8" rx="8" ry="4.2" fill="#C8E6C9" opacity=".72" transform="rotate(12 74 8)"/>

  <!-- Main pink bloom at corner bend -->
  <g transform="translate(26 26)">
    <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F7B6C8"/>
    <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F4A0B8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F8C4D4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F2A8BC" transform="rotate(216)"/>
    <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#FACDDA" transform="rotate(288)"/>
    <ellipse cx="0" cy="-6.8" rx="3.5" ry="5.4" fill="#FFF8FB" opacity=".52"/>
    <ellipse cx="0" cy="-6.8" rx="3.5" ry="5.4" fill="#FFF8FB" opacity=".42" transform="rotate(72)"/>
    <ellipse cx="0" cy="-6.8" rx="3.5" ry="5.4" fill="#FFF8FB" opacity=".48" transform="rotate(144)"/>
    <ellipse cx="0" cy="-6.8" rx="3.5" ry="5.4" fill="#FFF8FB" opacity=".4" transform="rotate(216)"/>
    <ellipse cx="0" cy="-6.8" rx="3.5" ry="5.4" fill="#FFF8FB" opacity=".46" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#F6E27A"/>
    <circle cx="0" cy="0" r="3.2" fill="#FFE566"/>
    <circle cx="-.8" cy="-.9" r="1.35" fill="#FFFDF5" opacity=".9"/>
  </g>

  <!-- Medium pink along top arm -->
  <g transform="translate(54 18)">
    <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#F5B8CA"/>
    <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#F8C8D6" transform="rotate(72)"/>
    <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#F2A4BC" transform="rotate(144)"/>
    <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#FACDDA" transform="rotate(216)"/>
    <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#F7B6C8" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3.5" fill="#F5DE6A"/>
    <circle cx="0" cy="0" r="2.2" fill="#FFE566"/>
    <circle cx="-.5" cy="-.55" r=".9" fill="#FFFDF5" opacity=".85"/>
  </g>

  <!-- Far pink bud on top arm (paper edge tip) -->
  <g transform="translate(76 10)">
    <ellipse cx="0" cy="0" rx="4.4" ry="6.2" fill="#F5B8CA" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="2.7" ry="4.1" fill="#FFE9F0" transform="rotate(30)" opacity=".82"/>
    <circle cx=".4" cy="-.2" r="1.7" fill="#F5DE6A"/>
  </g>

  <!-- Soft white blossom on left arm -->
  <g transform="translate(18 54)">
    <circle cx="0" cy="-4.6" r="2.8" fill="#FFF9FC"/>
    <circle cx="4" cy="-1.4" r="2.8" fill="#FDE8EF"/>
    <circle cx="2.45" cy="3.5" r="2.8" fill="#FFF9FC"/>
    <circle cx="-2.45" cy="3.5" r="2.8" fill="#FDE8EF"/>
    <circle cx="-4" cy="-1.4" r="2.8" fill="#FFF9FC"/>
    <circle cx="0" cy="0" r="2.1" fill="#F0D56A"/>
    <circle cx="-.4" cy="-.45" r=".75" fill="#FFFDF5" opacity=".85"/>
  </g>

  <!-- Far white daisy on left arm -->
  <g transform="translate(10 76)">
    <circle cx="0" cy="-2.9" r="1.7" fill="#FFF9FC"/>
    <circle cx="2.45" cy="-.95" r="1.7" fill="#FDE8EF"/>
    <circle cx="1.5" cy="2.2" r="1.7" fill="#FFF9FC"/>
    <circle cx="-1.5" cy="2.2" r="1.7" fill="#FDE8EF"/>
    <circle cx="-2.45" cy="-.95" r="1.7" fill="#FFF9FC"/>
    <circle cx="0" cy="0" r="1.25" fill="#F0D56A"/>
  </g>

  <!-- Petite pink between main + top -->
  <g transform="translate(42 38)">
    <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#FACDDA"/>
    <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#F7B6C8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#F8C4D4" transform="rotate(144)"/>
    <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#F4A0B8" transform="rotate(216)"/>
    <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#FDE8EF" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="2.35" fill="#FFE566"/>
    <circle cx="-.4" cy="-.5" r=".75" fill="#FFFDF5" opacity=".9"/>
  </g>

  <!-- Petite pink between main + left -->
  <g transform="translate(38 44) rotate(18)">
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#F8C4D4"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#F5B8CA" transform="rotate(72)"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#FACDDA" transform="rotate(144)"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#F2A8BC" transform="rotate(216)"/>
    <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#FFE9F0" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="1.95" fill="#F5DE6A"/>
  </g>

  <!-- Soft pollen / white sparkles -->
  <circle cx="38" cy="8" r="1.5" fill="#FFE566" opacity=".78"/>
  <circle cx="8" cy="38" r="1.35" fill="#F6E27A" opacity=".72"/>
  <circle cx="64" cy="30" r="1.2" fill="#FFF9FC" opacity=".88"/>
  <circle cx="30" cy="64" r="1.15" fill="#FFF9FC" opacity=".82"/>
  <circle cx="70" cy="22" r="1" fill="#FFE566" opacity=".65"/>
</svg>
