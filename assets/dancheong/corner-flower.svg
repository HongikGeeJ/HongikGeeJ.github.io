<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" shape-rendering="geometricPrecision">
  <!--
    Paper-edge flower cluster (top-left).
    Crisp leaves + pink / purple / white blooms. Flip via CSS for TR / BL / BR.
    Internal SMIL: staggered bloom pulse, leaf curl, soft floating petals (transform/opacity only).
  -->
  <!-- Leaf ribbon hugging outer paper edge — solid fills for clarity -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-1.4 8 40; 1.6 8 40; -1.4 8 40" keyTimes="0;0.5;1"
      dur="7.6s" begin="-0.4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path d="M0 64 C1 38 16 14 42 4 C24 16 10 34 6 58 C3 64 1 66 0 64 Z"
          fill="#7DB88A"/>
    <path d="M1 62 C3 40 18 16 44 6 C26 18 12 36 8 56 C5 62 2 64 1 62 Z"
          fill="#A5D4A8"/>
    <path d="M2 32 C12 10 30 2 52 1 C28 8 12 20 4 40 C2.5 36 1.5 33 2 32 Z"
          fill="#C5E8CB"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="1.5 40 8; -1.8 40 8; 1.5 40 8" keyTimes="0;0.5;1"
      dur="8.2s" begin="-2.1s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
    <path d="M64 0 C38 1 14 16 4 42 C16 24 34 10 58 6 C64 3 66 1 64 0 Z"
          fill="#8FC99A"/>
    <path d="M62 1 C40 3 16 18 6 44 C18 26 36 12 56 8 C62 4 64 2 62 1 Z"
          fill="#B8E0BA"/>
    <path d="M32 2 C12 8 4 24 2 46 C8 24 20 10 40 4 C36 2.5 33.5 1.5 32 2 Z"
          fill="#D8F0DC"/>
  </g>

  <!-- Extra leaf tips — soft curl -->
  <g transform="translate(12 54)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6;6;-6" keyTimes="0;0.5;1" dur="6.8s" begin="-0.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="0" rx="5.5" ry="11" fill="#6FA87C" transform="rotate(-22)"/>
    </g>
  </g>
  <g transform="translate(54 12)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="6;-6;6" keyTimes="0;0.5;1" dur="7.4s" begin="-1.8s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="0" rx="11" ry="5.5" fill="#93C99A" transform="rotate(22)"/>
    </g>
  </g>
  <g transform="translate(20 28)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-5;5;-5" keyTimes="0;0.5;1" dur="6.2s" begin="-3s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="0" rx="5" ry="9" fill="#B5DCB8" transform="rotate(-48)"/>
    </g>
  </g>
  <g transform="translate(28 20)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="5;-5;5" keyTimes="0;0.5;1" dur="6.6s" begin="-4.2s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="0" rx="9" ry="5" fill="#A5D4A8" transform="rotate(48)"/>
    </g>
  </g>
  <ellipse cx="8" cy="74" rx="4.2" ry="8" fill="#8FC99A" transform="rotate(-12 8 74)"/>
  <ellipse cx="74" cy="8" rx="8" ry="4.2" fill="#B8E0BA" transform="rotate(12 74 8)"/>

  <!-- Main pink bloom — gentle scale pulse + soft sway -->
  <g transform="translate(26 26)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.06;1" keyTimes="0;0.5;1" dur="4.6s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-2;2.4;-2" keyTimes="0;0.5;1" dur="5.8s" begin="-0.9s" repeatCount="indefinite"
        additive="sum" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F2A0B8"/>
      <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#E888A8" transform="rotate(72)"/>
      <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F6B8CC" transform="rotate(144)"/>
      <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#E890A8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-11.2" rx="6.4" ry="10" fill="#F8C4D4" transform="rotate(288)"/>
      <ellipse cx="0" cy="-6.8" rx="3.2" ry="5" fill="#FFF5F8"/>
      <ellipse cx="0" cy="-6.8" rx="3.2" ry="5" fill="#FFEAF1" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6.8" rx="3.2" ry="5" fill="#FFF5F8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6.8" rx="3.2" ry="5" fill="#FFEAF1" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6.8" rx="3.2" ry="5" fill="#FFF5F8" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="5" fill="#E8C84A"/>
      <circle cx="0" cy="0" r="3.2" fill="#F5DC5A"/>
      <circle cx="-.8" cy="-.9" r="1.25" fill="#FFFCE8"/>
    </g>
  </g>

  <!-- Medium purple bloom — staggered sway -->
  <g transform="translate(54 18)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.05;1" keyTimes="0;0.5;1" dur="5.2s" begin="-1.4s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <animateTransform attributeName="transform" type="rotate"
        values="2.2;-2.6;2.2" keyTimes="0;0.5;1" dur="6.4s" begin="-2.6s" repeatCount="indefinite"
        additive="sum" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#8B6BC9"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#A888E0" transform="rotate(72)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#7B5CB8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#B094E8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-8" rx="4.6" ry="7.2" fill="#9470CC" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="3.5" fill="#E8C84A"/>
      <circle cx="0" cy="0" r="2.2" fill="#F5DC5A"/>
      <circle cx="-.5" cy="-.55" r=".85" fill="#FFFCE8"/>
    </g>
  </g>

  <!-- Far lavender bud on top arm -->
  <g transform="translate(76 10)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-3;3.5;-3" keyTimes="0;0.5;1" dur="5.6s" begin="-3.5s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="0" rx="4.4" ry="6.2" fill="#9B7AD4" transform="rotate(30)"/>
      <ellipse cx="0" cy="0" rx="2.7" ry="4.1" fill="#EDE4F8" transform="rotate(30)"/>
      <circle cx=".4" cy="-.2" r="1.7" fill="#E8C84A"/>
    </g>
  </g>

  <!-- Soft white blossom on left arm -->
  <g transform="translate(18 54)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1;1.045;1" keyTimes="0;0.5;1" dur="5s" begin="-2s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <circle cx="0" cy="-4.6" r="2.8" fill="#FFF9FC"/>
      <circle cx="4" cy="-1.4" r="2.8" fill="#F5E0EA"/>
      <circle cx="2.45" cy="3.5" r="2.8" fill="#FFF9FC"/>
      <circle cx="-2.45" cy="3.5" r="2.8" fill="#F5E0EA"/>
      <circle cx="-4" cy="-1.4" r="2.8" fill="#FFF9FC"/>
      <circle cx="0" cy="0" r="2.1" fill="#E0C04A"/>
      <circle cx="-.4" cy="-.45" r=".7" fill="#FFFCE8"/>
    </g>
  </g>

  <!-- Far white daisy on left arm -->
  <g transform="translate(10 76)">
    <circle cx="0" cy="-2.9" r="1.7" fill="#FFF9FC"/>
    <circle cx="2.45" cy="-.95" r="1.7" fill="#F5E0EA"/>
    <circle cx="1.5" cy="2.2" r="1.7" fill="#FFF9FC"/>
    <circle cx="-1.5" cy="2.2" r="1.7" fill="#F5E0EA"/>
    <circle cx="-2.45" cy="-.95" r="1.7" fill="#FFF9FC"/>
    <circle cx="0" cy="0" r="1.25" fill="#E0C04A"/>
  </g>

  <!-- Petite purple between main + top -->
  <g transform="translate(42 38)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="2.5;-2.8;2.5" keyTimes="0;0.5;1" dur="5.4s" begin="-1.1s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#A888E0"/>
      <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#8B6BC9" transform="rotate(72)"/>
      <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#C4A8F0" transform="rotate(144)"/>
      <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#7B5CB8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-5.2" rx="3.1" ry="4.8" fill="#B094E8" transform="rotate(288)"/>
      <circle cx="0" cy="0" r="2.35" fill="#F5DC5A"/>
      <circle cx="-.4" cy="-.5" r=".7" fill="#FFFCE8"/>
    </g>
  </g>

  <!-- Petite pink between main + left -->
  <g transform="translate(38 44)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2.2;2.6;-2.2" keyTimes="0;0.5;1" dur="4.9s" begin="-2.8s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
      <g transform="rotate(18)">
        <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#F4A8C0"/>
        <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#E890A8" transform="rotate(72)"/>
        <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#F8C4D4" transform="rotate(144)"/>
        <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#E880A0" transform="rotate(216)"/>
        <ellipse cx="0" cy="-4.4" rx="2.6" ry="4.1" fill="#FFE0EC" transform="rotate(288)"/>
        <circle cx="0" cy="0" r="1.95" fill="#E8C84A"/>
      </g>
    </g>
  </g>

  <!-- Small purple bud tucked near left arm -->
  <g transform="translate(32 58)">
    <ellipse cx="0" cy="-3.6" rx="2.2" ry="3.8" fill="#8B6BC9"/>
    <ellipse cx="0" cy="-3.6" rx="2.2" ry="3.8" fill="#C4A8F0" transform="rotate(72)"/>
    <ellipse cx="0" cy="-3.6" rx="2.2" ry="3.8" fill="#7B5CB8" transform="rotate(144)"/>
    <ellipse cx="0" cy="-3.6" rx="2.2" ry="3.8" fill="#FFFFFF" transform="rotate(216)"/>
    <ellipse cx="0" cy="-3.6" rx="2.2" ry="3.8" fill="#A888E0" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="1.6" fill="#E8C84A"/>
  </g>

  <!-- Soft floating petals — translate + rotate, gentle opacity -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 2.5 -4.5; 1 -7; -1.5 -3; 0 0" keyTimes="0;0.28;0.55;0.78;1"
      dur="9.2s" begin="0s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate"
      values="12 46 50; 38 46 50; 58 46 50; 28 46 50; 12 46 50" keyTimes="0;0.28;0.55;0.78;1"
      dur="9.2s" begin="0s" repeatCount="indefinite" additive="sum"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.42;0.62;0.48;0.58;0.42" dur="9.2s" repeatCount="indefinite"/>
    <ellipse cx="46" cy="50" rx="2.2" ry="3.4" fill="#F2A0B8"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -2 -3.5; -0.5 -6.5; 1.5 -2.5; 0 0" keyTimes="0;0.3;0.58;0.8;1"
      dur="10.4s" begin="-3.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate"
      values="-8 58 34; -28 58 34; -48 58 34; -18 58 34; -8 58 34" keyTimes="0;0.3;0.58;0.8;1"
      dur="10.4s" begin="-3.2s" repeatCount="indefinite" additive="sum"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.38;0.55;0.42;0.52;0.38" dur="10.4s" begin="-3.2s" repeatCount="indefinite"/>
    <ellipse cx="58" cy="34" rx="1.9" ry="2.9" fill="#A888E0"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 1.8 -2.8; 0.5 -5; -1.2 -2; 0 0" keyTimes="0;0.25;0.52;0.76;1"
      dur="8.6s" begin="-5.1s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animateTransform attributeName="transform" type="rotate"
      values="20 34 56; 42 34 56; 62 34 56; 30 34 56; 20 34 56" keyTimes="0;0.25;0.52;0.76;1"
      dur="8.6s" begin="-5.1s" repeatCount="indefinite" additive="sum"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="0.32;0.48;0.36;0.44;0.32" dur="8.6s" begin="-5.1s" repeatCount="indefinite"/>
    <ellipse cx="34" cy="56" rx="1.6" ry="2.5" fill="#F6B8CC"/>
  </g>

  <!-- Crisp pollen accents -->
  <circle cx="38" cy="8" r="1.4" fill="#E8C84A"/>
  <circle cx="8" cy="38" r="1.25" fill="#E0C04A"/>
  <circle cx="64" cy="30" r="1.15" fill="#FFF9FC"/>
  <circle cx="30" cy="64" r="1.1" fill="#EDE4F8"/>
  <circle cx="70" cy="22" r=".95" fill="#F5DC5A"/>
</svg>
