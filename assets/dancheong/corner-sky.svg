<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <!--
    Taehyun card corner sky — HIGH CONTRAST for white cards.
    Blue-grey storm clouds, bright gold stars, wind streaks. Flip via CSS for BR.
  -->
  <defs>
    <radialGradient id="gGlow" cx="28%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#7eb0e0" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#a8c8e8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#a8c8e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gCloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fc"/>
      <stop offset="55%" stop-color="#b7cce4"/>
      <stop offset="100%" stop-color="#8aa8c8"/>
    </linearGradient>
    <linearGradient id="gStorm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e8eb0" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#4a6a8a" stop-opacity=".45"/>
    </linearGradient>
  </defs>

  <circle cx="22" cy="22" r="40" fill="url(#gGlow)"/>

  <!-- Storm mass -->
  <ellipse cx="30" cy="18" rx="28" ry="14" fill="url(#gStorm)" opacity=".7"/>

  <!-- Main cloud cluster (readable grey-blue on white) -->
  <g>
    <ellipse cx="12" cy="26" rx="14" ry="9" fill="url(#gCloud)"/>
    <ellipse cx="26" cy="20" rx="13" ry="10" fill="url(#gCloud)"/>
    <ellipse cx="38" cy="26" rx="11" ry="8" fill="url(#gCloud)"/>
    <ellipse cx="20" cy="32" rx="16" ry="9" fill="url(#gCloud)"/>
    <ellipse cx="8" cy="18" rx="8" ry="6" fill="#dce8f4"/>
  </g>

  <!-- Secondary cloud -->
  <g opacity=".95">
    <ellipse cx="48" cy="10" rx="10" ry="6.5" fill="url(#gCloud)"/>
    <ellipse cx="56" cy="13" rx="8" ry="5.5" fill="url(#gCloud)"/>
    <ellipse cx="42" cy="14" rx="7" ry="5" fill="#c5d6ea"/>
  </g>

  <!-- Wind streaks -->
  <g stroke="#7a9cc0" stroke-linecap="round" fill="none" opacity=".7">
    <path d="M52 28 C60 24 70 26 78 22" stroke-width="1.8"/>
    <path d="M50 34 C62 30 72 33 82 28" stroke-width="1.4" opacity=".8"/>
    <path d="M46 40 C58 38 68 40 76 36" stroke-width="1.2" opacity=".65"/>
  </g>

  <!-- Soft lightning -->
  <path d="M40 16 L35 28 L39 28 L34 40 L46 26 L41 26 Z"
        fill="#eef6ff" stroke="#9ab4d0" stroke-width=".6" opacity=".85"/>

  <!-- Bright stars (gold / white — visible on white card) -->
  <g>
    <path d="M62 22 L64.2 27.2 L69.8 27.6 L65.4 31.2 L66.8 36.6 L62 33.6 L57.2 36.6 L58.6 31.2 L54.2 27.6 L59.8 27.2 Z"
          fill="#f5c542" stroke="#e8a820" stroke-width=".4"/>
    <path d="M78 14 L79.4 17.2 L82.8 17.4 L80.2 19.6 L81 22.8 L78 21 L75 22.8 L75.8 19.6 L73.2 17.4 L76.6 17.2 Z"
          fill="#ffe08a"/>
    <path d="M70 44 L71.2 46.6 L74 46.8 L71.8 48.6 L72.4 51.2 L70 49.6 L67.6 51.2 L68.2 48.6 L66 46.8 L68.8 46.6 Z"
          fill="#fff4c0" stroke="#e8c060" stroke-width=".3"/>
    <circle cx="52" cy="48" r="2.2" fill="#ffd966"/>
    <circle cx="52" cy="48" r="1" fill="#fff"/>
    <circle cx="84" cy="36" r="1.8" fill="#ffe9a0"/>
    <circle cx="28" cy="52" r="1.6" fill="#fff8d0" stroke="#d0b050" stroke-width=".3"/>
    <circle cx="18" cy="58" r="1.2" fill="#f0d878"/>
    <circle cx="66" cy="58" r="1.4" fill="#fff"/>
    <circle cx="88" cy="48" r="1.1" fill="#ffe08a"/>
    <circle cx="44" cy="60" r="1" fill="#ffefb0"/>
  </g>

  <!-- Rain dots -->
  <g fill="#6a8aa8" opacity=".55">
    <circle cx="16" cy="44" r="1.1"/>
    <circle cx="24" cy="50" r=".9"/>
    <circle cx="32" cy="46" r="1"/>
    <circle cx="20" cy="56" r=".8"/>
    <circle cx="36" cy="54" r=".85"/>
  </g>
</svg>
