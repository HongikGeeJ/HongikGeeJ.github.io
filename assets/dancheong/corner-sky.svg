<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" shape-rendering="geometricPrecision">
  <!--
    Taehyun content-card sky corner (TL). Flip via CSS for BR.
    Minimal: soft clouds + stars + light storm vibe. Twinkle via SMIL opacity.
  -->
  <defs>
    <radialGradient id="skyGlow" cx="22%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#9ec9f0" stop-opacity=".35"/>
      <stop offset="55%" stop-color="#c5dcf0" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#c5dcf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#d4e4f4" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="stormTint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8b8d0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8aa0bc" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <!-- Soft atmosphere wash -->
  <circle cx="18" cy="18" r="34" fill="url(#skyGlow)"/>

  <!-- Distant storm haze -->
  <g opacity=".55">
    <animate attributeName="opacity" values=".4;.62;.4" dur="5.6s" begin="-1.2s" repeatCount="indefinite"/>
    <ellipse cx="28" cy="14" rx="22" ry="10" fill="url(#stormTint)"/>
  </g>

  <!-- Main cloud puff (corner hug) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 1.2 -0.8; 0 0; -0.6 0.5; 0 0" dur="7.2s" begin="0s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
    <ellipse cx="10" cy="22" rx="11" ry="7.5" fill="url(#cloudBody)"/>
    <ellipse cx="20" cy="18" rx="9" ry="7" fill="url(#cloudBody)"/>
    <ellipse cx="28" cy="22" rx="8" ry="6" fill="url(#cloudBody)"/>
    <ellipse cx="16" cy="26" rx="12" ry="6.5" fill="url(#cloudBody)"/>
  </g>

  <!-- Smaller trailing cloud -->
  <g opacity=".85">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -0.9 0.6; 0 0; 0.7 -0.4; 0 0" dur="8.4s" begin="-2.1s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"/>
    <ellipse cx="36" cy="8" rx="7" ry="4.5" fill="url(#cloudBody)"/>
    <ellipse cx="42" cy="10" rx="5.5" ry="3.8" fill="url(#cloudBody)"/>
    <ellipse cx="31" cy="11" rx="5" ry="3.5" fill="url(#cloudBody)"/>
  </g>

  <!-- Soft lightning flash (storm accent  very quiet) -->
  <g opacity="0">
    <animate attributeName="opacity"
      values="0;0;0;0.55;0;0;0;0.35;0;0;0;0;0;0;0;0"
      keyTimes="0;0.08;0.42;0.44;0.46;0.48;0.62;0.64;0.66;0.68;0.75;0.85;0.9;0.95;0.98;1"
      dur="6.8s" begin="-0.8s" repeatCount="indefinite"/>
    <path d="M34 16 L30 26 L33 26 L29 36 L38 24 L34 24 L38 16 Z"
          fill="#eef6ff" stroke="#c5d8f0" stroke-width=".4" opacity=".9"/>
  </g>

  <!-- Stars  soft twinkle ('4I F '1 F) -->
  <g>
    <!-- 4-point star helper via rotated diamonds -->
    <g transform="translate(48 20)">
      <animate attributeName="opacity" values=".25;.95;.35;.85;.25" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      <path d="M0 -3.2 L.85 -.85 L3.2 0 L.85 .85 L0 3.2 L-.85 .85 L-3.2 0 L-.85 -.85 Z" fill="#fff8e8"/>
      <circle cx="0" cy="0" r="1.1" fill="#ffe9a8"/>
    </g>
    <g transform="translate(56 32)">
      <animate attributeName="opacity" values=".2;.8;.3;.9;.2" dur="3.4s" begin="-.7s" repeatCount="indefinite"/>
      <path d="M0 -2.2 L.6 -.6 L2.2 0 L.6 .6 L0 2.2 L-.6 .6 L-2.2 0 L-.6 -.6 Z" fill="#fffaf0"/>
    </g>
    <g transform="translate(42 42)">
      <animate attributeName="opacity" values=".15;.75;.25;.7;.15" dur="3.1s" begin="-1.4s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="1.35" fill="#fff6d8"/>
      <circle cx="0" cy="0" r=".55" fill="#fff"/>
    </g>
    <g transform="translate(62 14)">
      <animate attributeName="opacity" values=".3;1;.4;.85;.3" dur="2.4s" begin="-0.3s" repeatCount="indefinite"/>
      <path d="M0 -2.6 L.7 -.7 L2.6 0 L.7 .7 L0 2.6 L-.7 .7 L-2.6 0 L-.7 -.7 Z" fill="#fffce8"/>
    </g>
    <g transform="translate(52 48)">
      <animate attributeName="opacity" values=".12;.65;.2;.55;.12" dur="3.8s" begin="-2s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="1" fill="#e8f0ff"/>
    </g>
    <g transform="translate(22 48)">
      <animate attributeName="opacity" values=".18;.7;.28;.6;.18" dur="2.9s" begin="-1.1s" repeatCount="indefinite"/>
      <path d="M0 -1.8 L.5 -.5 L1.8 0 L.5 .5 L0 1.8 L-.5 .5 L-1.8 0 L-.5 -.5 Z" fill="#fff8e0"/>
    </g>
  </g>

  <!-- Tiny rain dots under cloud (storm whisper) -->
  <g fill="#9bb4d0" opacity=".35">
    <g>
      <animate attributeName="opacity" values=".15;.4;.15" dur="2.2s" begin="0s" repeatCount="indefinite"/>
      <circle cx="14" cy="36" r=".7"/>
      <circle cx="20" cy="40" r=".55"/>
      <circle cx="26" cy="37" r=".65"/>
    </g>
    <g>
      <animate attributeName="opacity" values=".1;.35;.1" dur="2.6s" begin="-.9s" repeatCount="indefinite"/>
      <circle cx="18" cy="44" r=".5"/>
      <circle cx="24" cy="46" r=".45"/>
    </g>
  </g>
</svg>
